<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
  <title id="title">Privacy infrastructure at a glance</title>
  <desc id="desc">Target architecture, not deployment evidence. The reference application is the first consumer of the Privacy SDK. Its host owns the CCC client, wallet and operation-scoped signer and injects CCC capabilities through the SDK adapter. The SDK exposes Privacy Core and Protocol. Core CKB scripts settle on CKB L1.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#24618c"/></marker>
  </defs>
  <style>
    text { font-family:Arial,Helvetica,sans-serif; fill:#17324d; }
    .heading { font-size:36px; font-weight:700; }
    .label { font-size:25px; font-weight:700; }
    .body { font-size:21px; }
    .small { font-size:19px; }
    .box { fill:#fff; stroke:#5482a3; stroke-width:2; }
    .arrow { fill:none; stroke:#24618c; stroke-width:3; marker-end:url(#arrow); }
  </style>
  <rect width="1600" height="1180" fill="#fff"/>
  <rect x="64" y="40" width="7" height="40" rx="3" fill="#24618c"/>
  <text x="91" y="72" class="heading">Privacy infrastructure at a glance</text>
  <text x="64" y="119" class="small">Target architecture — not deployment evidence.</text>

  <rect x="64" y="165" width="1472" height="263" rx="20" fill="#f2f7fb" stroke="#5482a3" stroke-width="2"/>
  <text x="96" y="207" class="label">Host application</text>
  <text x="96" y="238" class="small">The application consumes privacy capabilities and retains ownership of chain access and user approval.</text>
  <rect x="96" y="262" width="590" height="130" rx="13" class="box"/>
  <text x="391" y="303" text-anchor="middle" class="label">Reference Application</text>
  <text x="391" y="337" text-anchor="middle" class="body">First controlled consumer of the SDK</text>
  <text x="391" y="368" text-anchor="middle" class="small">Fixed-denomination pool as the first use case</text>
  <rect x="914" y="262" width="590" height="130" rx="13" class="box"/>
  <text x="1209" y="303" text-anchor="middle" class="label">Application-owned CCC capabilities</text>
  <text x="1209" y="337" text-anchor="middle" class="body">CCC Client · Wallet</text>
  <text x="1209" y="368" text-anchor="middle" class="body">Operation-scoped Signer</text>

  <path d="M391 392V477H590V535" class="arrow"/>
  <rect x="403" y="444" width="109" height="25" fill="#fff"/>
  <text x="410" y="463" class="small">consumes</text>
  <path d="M1209 392V477H1010V535" class="arrow" stroke-dasharray="9 6"/>
  <text x="1070" y="463" class="small">injects CCC</text>

  <rect x="260" y="535" width="1080" height="159" rx="18" fill="#eaf3fa" stroke="#24618c" stroke-width="2.5"/>
  <text x="800" y="579" text-anchor="middle" class="label">Privacy SDK</text>
  <text x="800" y="619" text-anchor="middle" class="body">createPrivacyClient · privacy operations · capability reporting · notes/state</text>
  <text x="800" y="656" text-anchor="middle" class="small">Explicit CCC adapter boundary uses the host's injected Client and per-operation Signer</text>
  <path d="M800 694V774" class="arrow"/>
  <text x="823" y="742" class="small">exposes</text>

  <rect x="260" y="774" width="1080" height="186" rx="18" fill="#f2f7fb" stroke="#24618c" stroke-width="2.5"/>
  <text x="800" y="817" text-anchor="middle" class="label">Privacy Core / Protocol</text>
  <text x="800" y="855" text-anchor="middle" class="body">Privacy primitives · notes and commitments · state/root and nullifier rules</text>
  <text x="800" y="891" text-anchor="middle" class="body">Cryptographic verification · asset conservation · recipient binding</text>
  <text x="800" y="928" text-anchor="middle" class="body">CKB script enforcement</text>
  <path d="M800 960V1043" class="arrow"/>
  <text x="823" y="1010" class="small">Core's CKB scripts settle on</text>

  <rect x="380" y="1043" width="840" height="103" rx="18" fill="#eaf3fa" stroke="#24618c" stroke-width="2.5"/>
  <text x="800" y="1084" text-anchor="middle" class="label">CKB L1</text>
  <text x="800" y="1120" text-anchor="middle" class="body">Consensus verification and settlement through Scripts and Cells</text>
</svg>
