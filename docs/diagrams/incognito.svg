<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 700" font-family="'DejaVu Sans', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b4db1"/>
    </marker>
    <marker id="arrowmute" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5d6677"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1020" height="700" fill="#ffffff"/>

  <!-- title -->
  <rect x="46" y="30" width="4" height="34" fill="#1b4db1"/>
  <text x="62" y="48" font-size="20" font-weight="700" fill="#1b2330">Incognito mode, built inside CCC</text>
  <text x="62" y="70" font-size="13" fill="#5d6677">An opt-in stealth-address feature added to CCC as a package.</text>

  <!-- app box -->
  <rect x="310" y="92" width="400" height="60" rx="8" fill="#ffffff" stroke="#dfe0d8" stroke-width="1.5"/>
  <text x="510" y="118" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1b2330">Any CKB dApp already using CCC</text>
  <text x="510" y="138" text-anchor="middle" font-size="11.5" fill="#5d6677">opt-in: the app turns on incognito mode</text>

  <line x1="510" y1="152" x2="510" y2="188" stroke="#1b4db1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="520" y="175" font-size="11.5" fill="#1b4db1">uses CCC as normal</text>

  <!-- CCC container -->
  <rect x="100" y="190" width="820" height="250" rx="10" fill="#f6f7f4" stroke="#cfd3cb" stroke-width="1.5"/>
  <text x="118" y="216" font-size="15" font-weight="700" fill="#1b2330">CCC — ckb-ccc <tspan font-weight="400" font-size="12" fill="#5d6677">(the one-stop CKB library — wallet, signing, transactions, RPC, indexer: unchanged)</tspan></text>

  <!-- core box -->
  <rect x="120" y="232" width="360" height="58" rx="7" fill="#ffffff" stroke="#dfe0d8" stroke-width="1.5"/>
  <text x="300" y="258" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2330">@ckb-ccc/core</text>
  <text x="300" y="278" text-anchor="middle" font-size="10.5" fill="#5d6677">Client · Signer · Transaction · RPC · Indexer</text>

  <!-- existing packages chips -->
  <text x="510" y="246" font-size="10" fill="#5d6677">existing CCC packages</text>
  <rect x="510" y="256" width="86" height="30" rx="6" fill="#ffffff" stroke="#dfe0d8" stroke-width="1.5"/>
  <text x="553" y="275" text-anchor="middle" font-size="11" fill="#1b2330">did-ckb</text>
  <rect x="606" y="256" width="86" height="30" rx="6" fill="#ffffff" stroke="#dfe0d8" stroke-width="1.5"/>
  <text x="649" y="275" text-anchor="middle" font-size="11" fill="#1b2330">spore</text>
  <rect x="702" y="256" width="86" height="30" rx="6" fill="#ffffff" stroke="#dfe0d8" stroke-width="1.5"/>
  <text x="745" y="275" text-anchor="middle" font-size="11" fill="#1b2330">udt</text>

  <!-- stealth (funded) package -->
  <rect x="120" y="306" width="680" height="118" rx="8" fill="#e7eefb" stroke="#1b4db1" stroke-width="2.5"/>
  <text x="138" y="342" font-size="15.5" font-weight="700" fill="#1b2330">@ckb-ccc/stealth — incognito mode</text>
  <text x="138" y="366" font-size="11.5" fill="#1b2330">Stealth address: derive one-time address · scan with view key · spend</text>
  <text x="138" y="385" font-size="11.5" fill="#1b2330">· optional fresh change output</text>
  <text x="138" y="408" font-size="10.5" font-style="italic" fill="#5d6677">an opt-in package inside CCC, the same shape as did-ckb / spore / udt</text>

  <line x1="510" y1="440" x2="510" y2="474" stroke="#1b4db1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="520" y="463" font-size="11.5" fill="#1b4db1">one-time output → core completes · signs · submits</text>

  <!-- CKB testnet box -->
  <rect x="270" y="478" width="480" height="86" rx="8" fill="#ffffff" stroke="#dfe0d8" stroke-width="1.5"/>
  <text x="510" y="502" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2330">CKB testnet</text>
  <rect x="320" y="512" width="380" height="28" rx="6" fill="#eef0ea" stroke="#dfe0d8" stroke-width="1"/>
  <text x="510" y="530" text-anchor="middle" font-size="10.5" fill="#1b2330">Obscell stealth lock — reused (already deployed)</text>
  <text x="510" y="556" text-anchor="middle" font-size="10" fill="#5d6677">no new on-chain protocol</text>

  <!-- return / scan path -->
  <path d="M750,520 H880 V366 H802" fill="none" stroke="#5d6677" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowmute)"/>
  <text x="888" y="432" font-size="10.5" fill="#5d6677">scan with the view key,</text>
  <text x="888" y="448" font-size="10.5" fill="#5d6677">detect the payment,</text>
  <text x="888" y="464" font-size="10.5" fill="#5d6677">then spend via CCC</text>

</svg>