<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Privacy SDK integration boundary</title>
  <desc id="desc">Target architecture, not deployment evidence. The host owns its CCC Client, Wallet and operation-scoped Signer. Across an explicit integration boundary it injects the Client at initialization and the Signer per operation. The SDK exposes createPrivacyClient, capability reporting, notes and state handling, a prover interface and a CCC adapter, returning privacy operations and verified state. The SDK never owns React, wallet connectors or raw private keys.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#24618c"/></marker>
  </defs>
  <style>
    text { font-family:Arial,Helvetica,sans-serif; fill:#17324d; }
    .heading { font-size:36px; font-weight:700; }
    .label { font-size:25px; font-weight:700; }
    .body { font-size:21px; }
    .small { font-size:19px; }
    .card { fill:#fff; stroke:#5482a3; stroke-width:2; }
    .arrow { fill:none; stroke:#24618c; stroke-width:3; marker-end:url(#arrow); }
  </style>
  <rect width="1600" height="1100" fill="#fff"/>
  <rect x="64" y="40" width="7" height="40" rx="3" fill="#24618c"/>
  <text x="91" y="72" class="heading">Privacy SDK integration boundary</text>
  <text x="64" y="119" class="small">Figure 6 · Target architecture — not deployment evidence.</text>

  <rect x="64" y="190" width="560" height="795" rx="20" fill="#f2f7fb" stroke="#5482a3" stroke-width="2"/>
  <text x="344" y="242" text-anchor="middle" class="label">Host Application</text>
  <text x="344" y="277" text-anchor="middle" class="small">Owns the client, wallet and signer</text>
  <rect x="100" y="310" width="488" height="116" rx="13" class="card"/>
  <text x="344" y="353" text-anchor="middle" class="label">CCC Client</text>
  <text x="344" y="392" text-anchor="middle" class="small">Chain reads and transaction context</text>
  <rect x="100" y="520" width="488" height="116" rx="13" class="card"/>
  <text x="344" y="564" text-anchor="middle" class="label">Wallet</text>
  <text x="344" y="603" text-anchor="middle" class="small">Host selects and connects the wallet</text>
  <rect x="100" y="738" width="488" height="116" rx="13" class="card"/>
  <text x="344" y="781" text-anchor="middle" class="label">Operation-scoped Signer</text>
  <text x="344" y="820" text-anchor="middle" class="small">User approval for the requested operation</text>
  <text x="344" y="926" text-anchor="middle" class="small">Reference app: the first SDK consumer</text>

  <line x1="800" y1="254" x2="800" y2="973" stroke="#97b4c9" stroke-width="2" stroke-dasharray="8 7"/>
  <rect x="680" y="189" width="240" height="65" rx="12" fill="#eaf3fa"/>
  <text x="800" y="217" text-anchor="middle" class="small" font-weight="700">INTEGRATION</text>
  <text x="800" y="241" text-anchor="middle" class="small" font-weight="700">BOUNDARY</text>

  <rect x="976" y="190" width="560" height="795" rx="20" fill="#eaf3fa" stroke="#24618c" stroke-width="2.5"/>
  <text x="1256" y="242" text-anchor="middle" class="label">Privacy SDK</text>
  <text x="1256" y="277" text-anchor="middle" class="small">Exposes Privacy Core / Protocol capabilities</text>
  <rect x="1012" y="310" width="488" height="116" rx="13" class="card"/>
  <text x="1256" y="353" text-anchor="middle" class="label">createPrivacyClient</text>
  <text x="1256" y="392" text-anchor="middle" class="small">Initialize with application-owned dependencies</text>
  <rect x="1012" y="454" width="488" height="76" rx="13" class="card"/>
  <text x="1256" y="485" text-anchor="middle" class="body" font-weight="700">Capability reporting</text>
  <text x="1256" y="512" text-anchor="middle" class="small">Supported and unavailable operations</text>
  <rect x="1012" y="552" width="488" height="76" rx="13" class="card"/>
  <text x="1256" y="583" text-anchor="middle" class="body" font-weight="700">Notes / state handling</text>
  <text x="1256" y="610" text-anchor="middle" class="small">Local secrets and verified state boundaries</text>
  <rect x="1012" y="650" width="488" height="76" rx="13" class="card"/>
  <text x="1256" y="681" text-anchor="middle" class="body" font-weight="700">Prover interface</text>
  <text x="1256" y="708" text-anchor="middle" class="small">Explicit proof capability and status</text>
  <rect x="1012" y="750" width="488" height="104" rx="13" fill="#dcecf7" stroke="#24618c" stroke-width="2"/>
  <text x="1256" y="790" text-anchor="middle" class="label">CCC adapter</text>
  <text x="1256" y="827" text-anchor="middle" class="small">Uses the supplied Client and Signer</text>
  <text x="1256" y="926" text-anchor="middle" class="small">Operations remain capability-gated</text>

  <path d="M588 368H1012" class="arrow"/>
  <rect x="647" y="326" width="306" height="30" fill="#fff"/>
  <text x="800" y="348" text-anchor="middle" class="small">Inject Client at initialization</text>
  <path d="M588 796H1012" class="arrow"/>
  <rect x="647" y="754" width="306" height="30" fill="#fff"/>
  <text x="800" y="776" text-anchor="middle" class="small">Inject Signer per operation</text>
  <path d="M976 915H624" class="arrow" stroke-dasharray="8 6"/>
  <rect x="650" y="874" width="300" height="30" fill="#fff"/>
  <text x="800" y="896" text-anchor="middle" class="small">Return privacy operations</text>
  <rect x="697" y="930" width="206" height="30" fill="#fff"/>
  <text x="800" y="952" text-anchor="middle" class="small">and verified state</text>

  <rect x="64" y="1020" width="1472" height="52" rx="12" fill="#f2f7fb"/>
  <text x="800" y="1053" text-anchor="middle" class="body">The SDK never owns React, wallet connectors or raw private keys. Ownership stays with the host application.</text>
</svg>
