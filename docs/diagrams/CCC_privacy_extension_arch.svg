<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" font-family="'DejaVu Sans', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b4db1"/>
    </marker>
    <marker id="arrowmute" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5d6677"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="740" fill="#ffffff"/>

  <!-- title -->
  <rect x="46" y="34" width="4" height="34" fill="#1b4db1"/>
  <text x="62" y="52" font-size="20" font-weight="700" fill="#1b2330">Privacy extension to CCC — architecture</text>
  <text x="62" y="74" font-size="13" fill="#5d6677">A privacy SDK layered on top of CCC. CCC keeps wallet, signing, RPC and indexer; the SDK adds one privacy primitive.</text>

  <!-- Box 1: Host application -->
  <rect x="110" y="104" width="420" height="72" rx="8" fill="#ffffff" stroke="#dfe0d8" stroke-width="1.5"/>
  <text x="320" y="134" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1b2330">Host CKB application</text>
  <text x="320" y="156" text-anchor="middle" font-size="11.5" fill="#5d6677">owns wallet choice, user approval, and UX</text>

  <!-- arrow 1 -->
  <line x1="320" y1="176" x2="320" y2="212" stroke="#1b4db1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="199" font-size="11.5" fill="#1b4db1">1 · prepare a private operation</text>

  <!-- Box 2: Privacy SDK -->
  <rect x="110" y="214" width="420" height="104" rx="8" fill="#e7eefb" stroke="#1b4db1" stroke-width="2.5"/>
  <text x="130" y="252" font-size="15.5" font-weight="700" fill="#1b2330">Privacy SDK (CCC extension)</text>
  <text x="130" y="278" font-size="11.5" fill="#1b2330">The privacy primitive only. For example, stealth addresses:</text>
  <text x="130" y="296" font-size="11.5" fill="#5d6677">derive one-time address · scan for incoming payments · shape the transaction</text>
  <text x="130" y="311" font-size="10.5" fill="#5d6677" font-style="italic">no mixer, no coordinator, no protocol — it hands a normal transaction to CCC</text>

  <!-- arrow 2 -->
  <line x1="320" y1="318" x2="320" y2="354" stroke="#1b4db1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="341" font-size="11.5" fill="#1b4db1">2 · hand the transaction to the app's CCC</text>

  <!-- Box 3: CCC -->
  <rect x="110" y="356" width="420" height="96" rx="8" fill="#ffffff" stroke="#dfe0d8" stroke-width="1.5"/>
  <text x="320" y="384" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1b2330">CCC — Client + Signer <tspan fill="#5d6677" font-weight="400" font-size="12">(app-owned, unchanged)</tspan></text>
  <text x="320" y="408" text-anchor="middle" font-size="11.5" fill="#5d6677">connectivity · wallet approval · signing · transaction primitives</text>
  <text x="320" y="426" text-anchor="middle" font-size="11.5" fill="#5d6677">RPC · indexer · fee &amp; input completion</text>

  <!-- arrow 3 -->
  <line x1="320" y1="452" x2="320" y2="488" stroke="#1b4db1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="475" font-size="11.5" fill="#1b4db1">3 · CCC completes · signs · submits</text>

  <!-- Box 4: CKB L1 -->
  <rect x="110" y="490" width="420" height="72" rx="8" fill="#ffffff" stroke="#dfe0d8" stroke-width="1.5"/>
  <text x="320" y="520" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1b2330">CKB L1</text>
  <text x="320" y="542" text-anchor="middle" font-size="11.5" fill="#5d6677">scripts + cells · consensus verification &amp; settlement</text>

  <!-- return path: CKB -> SDK (scan/receive) -->
  <path d="M530,526 H700 V266 H532" fill="none" stroke="#5d6677" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowmute)"/>
  <text x="712" y="372" font-size="11" fill="#5d6677">4 · scan chain via CCC</text>
  <text x="712" y="388" font-size="11" fill="#5d6677">client / indexer —</text>
  <text x="712" y="404" font-size="11" fill="#5d6677">detect incoming private</text>
  <text x="712" y="420" font-size="11" fill="#5d6677">payments with the view key</text>

  <!-- footnote -->
  <line x1="62" y1="606" x2="838" y2="606" stroke="#dfe0d8" stroke-width="1"/>
  <text x="62" y="632" font-size="11.5" fill="#5d6677">The app keeps its existing CCC wallet and signer; the SDK never owns keys, connectivity, or</text>
  <text x="62" y="650" font-size="11.5" fill="#5d6677">submission. Deliverable = one privacy primitive, importable as a TypeScript package, demonstrated end-to-end on the Pudge testnet.</text>
  <text x="62" y="686" font-size="11" fill="#1b2330" font-weight="700">Cell Privacy Kit · a privacy extension to CCC</text>
</svg>