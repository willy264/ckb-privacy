name: CCC Stealth Package and Demo

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and system dependencies
        run: pnpm --filter frontend exec playwright install --with-deps chromium

      - name: Verify stealth derivation, scanning and transaction boundaries
        run: pnpm run test:stealth

      - name: Build and verify the incognito browser demo
        run: pnpm --filter frontend test:demo
